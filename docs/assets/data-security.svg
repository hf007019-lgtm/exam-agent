<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Exam Agent 数据安全设计</title><desc id="desc">公开仓库的数据边界与敏感信息保护规则</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1200" y2="560"><stop stop-color="#0B1727"/><stop offset="1" stop-color="#16172D"/></linearGradient><linearGradient id="shield" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#70B8CF"/><stop offset="1" stop-color="#8C7CC2"/></linearGradient></defs>
  <rect x="1" y="1" width="1198" height="558" rx="28" fill="url(#bg)" stroke="#293F59" stroke-width="2"/>
  <text x="600" y="58" text-anchor="middle" fill="#F1F5F9" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="32" font-weight="700">数据安全设计</text>
  <g transform="translate(70 105)" font-family="Arial,'Microsoft YaHei',sans-serif">
    <rect width="330" height="380" rx="26" fill="#11263B" stroke="#365B73" stroke-width="2"/>
    <path d="M165 55l72 27v61c0 57-34 98-72 119-38-21-72-62-72-119V82z" fill="#152F47" stroke="url(#shield)" stroke-width="4"/>
    <path d="M133 147l23 23 45-58" fill="none" stroke="#83CBC3" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="165" y="310" text-anchor="middle" fill="#E9F1F5" font-size="23" font-weight="700">本地优先 · 默认脱敏</text>
    <text x="165" y="344" text-anchor="middle" fill="#91A9BA" font-size="15">公开边界清晰，可核验且可控</text>
  </g>
  <g transform="translate(445 105)" font-family="Arial,'Microsoft YaHei',sans-serif">
    <rect width="685" height="380" rx="26" fill="#151F37" stroke="#464663" stroke-width="2"/>
    <text x="40" y="52" fill="#D9D5E6" font-size="20" font-weight="700">公开仓库不提交</text>
    <g font-size="17" fill="#BAC5D0"><circle cx="53" cy="94" r="12" fill="#25304A"/><path d="M47 94h12" stroke="#9E8FCD" stroke-width="3"/><text x="80" y="100">真实 Excel / CSV</text><circle cx="53" cy="140" r="12" fill="#25304A"/><path d="M47 140h12" stroke="#9E8FCD" stroke-width="3"/><text x="80" y="146">SQLite 数据库</text><circle cx="53" cy="186" r="12" fill="#25304A"/><path d="M47 186h12" stroke="#9E8FCD" stroke-width="3"/><text x="80" y="192">.env / API Key</text></g>
    <path d="M342 35v310" stroke="#384258"/>
    <text x="382" y="52" fill="#D9D5E6" font-size="20" font-weight="700">默认隐藏</text>
    <g font-size="16" fill="#BAC5D0"><path d="M388 91l7 7 13-16" stroke="#7FC7C2" stroke-width="3" fill="none" stroke-linecap="round"/><text x="420" y="98">姓名、准考证号</text><path d="M388 137l7 7 13-16" stroke="#7FC7C2" stroke-width="3" fill="none" stroke-linecap="round"/><text x="420" y="144">身份证号、手机号</text></g>
    <rect x="35" y="235" width="615" height="105" rx="18" fill="#102739" stroke="#34566A"/>
    <text x="58" y="270" fill="#88C9D0" font-size="18" font-weight="700">公开仓库只保留</text>
    <text x="58" y="305" fill="#B8C5CF" font-size="16">代码 · 文档 · 示例配置 · 虚构或充分脱敏截图</text>
  </g>
</svg>
