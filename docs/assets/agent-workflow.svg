<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Exam Agent Agent 工作流</title><desc id="desc">从用户问题到岗位卡片与风险提示的八步工作流</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1200" y2="760"><stop stop-color="#0B1727"/><stop offset="1" stop-color="#16172D"/></linearGradient><linearGradient id="num"><stop stop-color="#62ABC5"/><stop offset="1" stop-color="#8D7CC3"/></linearGradient><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#557D99"/></marker></defs>
  <rect x="1" y="1" width="1198" height="758" rx="28" fill="url(#bg)" stroke="#293F59" stroke-width="2"/>
  <text x="600" y="58" text-anchor="middle" fill="#F1F5F9" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="32" font-weight="700">Agent 工作流</text>
  <g font-family="Arial,'Microsoft YaHei',sans-serif">
    <path d="M330 143h160M710 143h160M930 195v78M870 325H710M490 325H330M270 377v78M330 507h160M710 507h160" fill="none" stroke="#557D99" stroke-width="3" marker-end="url(#arr)"/>
    <g transform="translate(90 95)"><rect width="240" height="96" rx="20" fill="#12283E" stroke="#376078"/><circle cx="38" cy="48" r="22" fill="url(#num)"/><text x="38" y="55" text-anchor="middle" fill="#08131F" font-size="19" font-weight="700">1</text><text x="72" y="55" fill="#ECF3F7" font-size="21" font-weight="700">用户问题</text></g>
    <g transform="translate(490 95)"><rect width="220" height="96" rx="20" fill="#12283E" stroke="#376078"/><circle cx="38" cy="48" r="22" fill="url(#num)"/><text x="38" y="55" text-anchor="middle" fill="#08131F" font-size="19" font-weight="700">2</text><text x="72" y="55" fill="#ECF3F7" font-size="21" font-weight="700">意图识别</text></g>
    <g transform="translate(870 95)"><rect width="250" height="100" rx="20" fill="#12283E" stroke="#376078"/><circle cx="38" cy="50" r="22" fill="url(#num)"/><text x="38" y="57" text-anchor="middle" fill="#08131F" font-size="19" font-weight="700">3</text><text x="72" y="40" fill="#ECF3F7" font-size="19" font-weight="700">解析筛选条件</text><text x="72" y="67" fill="#91A9BA" font-size="14">省份 / 城市 / 学历</text><text x="72" y="87" fill="#91A9BA" font-size="14">专业 / 岗位代码</text></g>
    <g transform="translate(710 275)"><rect width="250" height="100" rx="20" fill="#15243D" stroke="#465170"/><circle cx="38" cy="50" r="22" fill="url(#num)"/><text x="38" y="57" text-anchor="middle" fill="#08131F" font-size="19" font-weight="700">4</text><text x="72" y="43" fill="#ECF3F7" font-size="18" font-weight="700">结构化工具检索</text><text x="72" y="69" fill="#9EA7BB" font-size="14">查询可核验岗位事实</text></g>
    <g transform="translate(240 275)"><rect width="470" height="100" rx="20" fill="#15243D" stroke="#465170"/><circle cx="38" cy="50" r="22" fill="url(#num)"/><text x="38" y="57" text-anchor="middle" fill="#08131F" font-size="19" font-weight="700">5</text><text x="78" y="40" fill="#ECF3F7" font-size="18" font-weight="700">匹配分数与成绩参考</text><text x="78" y="68" fill="#9EA7BB" font-size="14">官方分数线 / 资格复审样本 / 候选成绩样本</text></g>
    <g transform="translate(90 455)"><rect width="240" height="104" rx="20" fill="#19213A" stroke="#4C496E"/><circle cx="38" cy="52" r="22" fill="url(#num)"/><text x="38" y="59" text-anchor="middle" fill="#08131F" font-size="19" font-weight="700">6</text><text x="72" y="43" fill="#ECF3F7" font-size="18" font-weight="700">补充报名数据</text><text x="72" y="70" fill="#A49DB8" font-size="14">缴费人数与岗位限制</text></g>
    <g transform="translate(490 455)"><rect width="220" height="104" rx="20" fill="#19213A" stroke="#4C496E"/><circle cx="38" cy="52" r="22" fill="url(#num)"/><text x="38" y="59" text-anchor="middle" fill="#08131F" font-size="19" font-weight="700">7</text><text x="72" y="59" fill="#ECF3F7" font-size="19" font-weight="700">生成岗位卡片</text></g>
    <g transform="translate(870 455)"><rect width="250" height="104" rx="20" fill="#19213A" stroke="#4C496E"/><circle cx="38" cy="52" r="22" fill="url(#num)"/><text x="38" y="59" text-anchor="middle" fill="#08131F" font-size="19" font-weight="700">8</text><text x="72" y="39" fill="#ECF3F7" font-size="18" font-weight="700">输出分析结果</text><text x="72" y="66" fill="#A49DB8" font-size="14">风险提示 · 数据来源</text><text x="72" y="87" fill="#A49DB8" font-size="14">免责声明</text></g>
    <rect x="155" y="645" width="890" height="62" rx="20" fill="#101F31" stroke="#39576D"/>
    <path d="M195 665l11 20 11-20M206 665v13" stroke="#81C9C3" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="600" y="684" text-anchor="middle" fill="#B9C8D4" font-size="18">AI 分析仅辅助参考，请以官方公告和职位表为准</text>
